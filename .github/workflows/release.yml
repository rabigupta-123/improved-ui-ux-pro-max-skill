name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: cli
        run: npx playwright install --with-deps chromium

      - name: Run aggregate offline data gate
        run: npm --prefix cli run verify:data

      - name: Build CLI
        working-directory: cli
        run: npm run build

      - name: Run CLI end-to-end regression tests
        working-directory: cli
        run: npx playwright test

      - name: Install gallery dependencies
        working-directory: gallery
        run: npm ci

      - name: Test and build gallery
        working-directory: gallery
        run: |
          npm test
          npm run build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes \
            -p semantic-release \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/github \
            -p conventional-changelog-conventionalcommits \
            semantic-release

      - name: Publish CLI to npm
        if: env.NPM_TOKEN != ''
        continue-on-error: true
        working-directory: cli
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NPM_TOKEN}"
          npm publish --access public || echo "::warning::npm publish failed (check NPM_TOKEN secret or npm trusted publisher setup)"
